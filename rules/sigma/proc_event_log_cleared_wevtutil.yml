title: wevtutil clears an event log
name: proc_event_log_cleared_wevtutil
id: 6b3028b1-9189-4495-9467-2c9756665473
status: experimental
description: |
  wevtutil cl <log> empties a Windows event log. Attackers clear logs to erase
  their tracks; it only works against logs that weren't already forwarded to
  a central collector.
references:
  - https://attack.mitre.org/techniques/T1685/005/
author: bde course project
date: 2026-11-03
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\wevtutil.exe'
    - OriginalFileName: 'wevtutil.exe'
  selection_flag:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: all of selection_*
falsepositives:
  - Admins resetting logs on test machines
level: high
