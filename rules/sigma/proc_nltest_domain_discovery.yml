title: nltest lists domain controllers or domain trusts
name: proc_nltest_domain_discovery
id: ebf185a6-3c96-47e9-9f6a-76812b20a011
status: experimental
description: |
  nltest /dclist and /domain_trusts map out the Windows domain: where the
  domain controllers are and which other domains trust this one.
references:
  - https://attack.mitre.org/techniques/T1018/
  - https://attack.mitre.org/techniques/T1482/
author: bde course project
date: 2026-11-03
tags:
  - attack.discovery
  - attack.t1018
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\nltest.exe'
    - OriginalFileName: 'nltestrk.exe'
  selection_flags:
    CommandLine|contains:
      - '/dclist'
      - '/dsgetdc'
      - '/domain_trusts'
      - '/all_trusts'
  condition: all of selection_*
falsepositives:
  - Domain admins troubleshooting
level: medium
