title: certutil downloads a file from a URL
name: proc_certutil_download
id: 277efcb9-8958-4688-aa4f-63512b8f9e23
status: experimental
description: |
  certutil is a certificate tool, but -urlcache (and -verifyctl) can fetch any
  URL and save it to disk. Attackers use it as a download tool that is already
  installed and signed by Microsoft.
references:
  - https://attack.mitre.org/software/S0160/
  - https://attack.mitre.org/techniques/T1105/
author: bde course project
date: 2026-11-03
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_flag:
    CommandLine|windash|contains:
      - ' -urlcache '
      - ' -verifyctl '
      - ' -url '
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: all of selection_*
falsepositives:
  - Admins fetching a certificate revocation list (CRL) by hand
level: high
